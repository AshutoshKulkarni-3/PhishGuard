# ==============================================================================
# PhishGuard — Spring Boot Application Configuration
# ==============================================================================

# Application Metadata
spring.application.name=phishguard-backend

# ------------------------------------------------------------------------------
# 1. Embedded Web Server Configuration
# ------------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ------------------------------------------------------------------------------
# 2. Database & Connection Pool Configuration (MySQL)
# SENSITIVE VALUES ARE EXTERNALIZED VIA ENVIRONMENT VARIABLES (ZERO HARDCODING)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:phishguard_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# 3. JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# 4. External Python Flask ML Inference Service Configuration
# ------------------------------------------------------------------------------
phishguard.ml-service.url=${ML_SERVICE_URL:http://localhost:5050}
phishguard.ml-service.predict-endpoint=/predict
phishguard.ml-service.health-endpoint=/health
phishguard.ml-service.connect-timeout-ms=${ML_CONNECT_TIMEOUT:3000}
phishguard.ml-service.read-timeout-ms=${ML_READ_TIMEOUT:5000}

# ------------------------------------------------------------------------------
# 5. Logging Configuration
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.phishguard=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
